<script type="text/babel" data-presets="react,env">
const { useState, useEffect, useMemo, useRef } = React;

// ============================================================
// FIREBASE INITIALIZATION
// Config is loaded from the external firebase-config.js file
// ============================================================
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || null;

let firebaseReady = false;
let db = null;
try {
  if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== "PASTE_YOUR_API_KEY_HERE") {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    firebaseReady = true;
  }
} catch (e) {
  console.error("Firebase init error:", e);
}

// ============================================================
// CONSTANTS
// ============================================================

const COLORS = {
  red:    { main: "#E53935", light: "#FFCDD2", dark: "#B71C1C", name: "சிவப்பு", label: "RED" },
  green:  { main: "#43A047", light: "#C8E6C9", dark: "#1B5E20", name: "பச்சை",  label: "GREEN" },
  yellow: { main: "#FDD835", light: "#FFF9C4", dark: "#F57F17", name: "மஞ்சள்", label: "YELLOW" },
  blue:   { main: "#29B6F6", light: "#B3E5FC", dark: "#0277BD", name: "நீலம்",  label: "BLUE" },
};

const PLAYER_ORDER = ["red", "green", "yellow", "blue"];
const BONUS_VALUES = new Set([1, 5, 6, 12]);
const ENTRY_VALUES = new Set([1, 5]);

function outerRingCounterClockwise() {
  const r = [];
  for (let c = 6; c >= 0; c--) r.push(`0,${c}`);
  for (let row = 1; row <= 6; row++) r.push(`${row},0`);
  for (let c = 1; c <= 6; c++) r.push(`6,${c}`);
  for (let row = 5; row >= 1; row--) r.push(`${row},6`);
  return r;
}
function middleRingCounterClockwise() {
  const r = [];
  for (let c = 5; c >= 1; c--) r.push(`1,${c}`);
  for (let row = 2; row <= 5; row++) r.push(`${row},1`);
  for (let c = 2; c <= 5; c++) r.push(`5,${c}`);
  for (let row = 4; row >= 2; row--) r.push(`${row},5`);
  return r;
}
function innerRingCounterClockwise() {
  const r = [];
  for (let c = 4; c >= 2; c--) r.push(`2,${c}`);
  for (let row = 3; row <= 4; row++) r.push(`${row},2`);
  for (let c = 3; c <= 4; c++) r.push(`4,${c}`);
  r.push(`3,4`);
  return r;
}
const OUTER = outerRingCounterClockwise();
const MIDDLE = middleRingCounterClockwise();
const INNER = innerRingCounterClockwise();
const CENTER = "3,3";
const ENTRY_SQUARE_V2 = { green: "0,3", red: "3,0", yellow: "3,6", blue: "6,3" };

function rotateRing(ring, startSquare) {
  const i = ring.indexOf(startSquare);
  if (i === -1) return ring;
  return [...ring.slice(i), ...ring.slice(0, i)];
}
function buildPath(color) {
  const start = ENTRY_SQUARE_V2[color];
  const outer = rotateRing(OUTER, start);
  const middleEntry = { green: "1,3", red: "3,1", blue: "5,3", yellow: "3,5" }[color];
  const middle = rotateRing(MIDDLE, middleEntry);
  const innerEntry = { green: "2,3", red: "3,2", blue: "4,3", yellow: "3,4" }[color];
  const inner = rotateRing(INNER, innerEntry);
  return [...outer, ...middle, ...inner, CENTER];
}
const PATHS = {
  red: buildPath("red"), green: buildPath("green"),
  yellow: buildPath("yellow"), blue: buildPath("blue"),
};
const SAFE_SQUARES = new Set([
  "0,3", "3,0", "6,3", "3,6",
  "1,1", "1,5", "5,1", "5,5",
  "3,3",
]);
const ENTRY_COLOR_MAP = { "0,3": "green", "3,0": "red", "3,6": "yellow", "6,3": "blue" };

function makeInitialCoins() {
  const c = {};
  Object.keys(COLORS).forEach((color) => {
    for (let i = 0; i < 6; i++) {
      c[`${color}-${i}`] = { color, pathIndex: -1, finished: false };
    }
  });
  return c;
}

function generateRoomCode() {
  return Math.floor(1000 + Math.random() * 9000).toString();
}

function generatePlayerId() {
  return 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
}

function Lobby({ onJoinRoom }) {
  const [mode, setMode] = useState("home"); // home | create | join
  const [name, setName] = useState(localStorage.getItem("thaayam_name") || "");
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const saveName = (n) => {
    setName(n);
    localStorage.setItem("thaayam_name", n);
  };

  const handleCreate = async () => {
    setError("");
    if (!name.trim()) { setError("Please enter your name"); return; }
    if (!firebaseReady) { setError("Firebase not configured. Please add config in the HTML file."); return; }
    setBusy(true);
    try {
      // Generate unique room code (try a few times if collision)
      let roomCode;
      for (let i = 0; i < 5; i++) {
        roomCode = generateRoomCode();
        const snap = await db.ref(`rooms/${roomCode}`).once("value");
        if (!snap.exists()) break;
      }
      const playerId = generatePlayerId();
      const roomData = {
        host: playerId,
        status: "waiting", // waiting | playing | finished
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        players: {
          [playerId]: {
            name: name.trim(),
            color: "red",
            joinedAt: firebase.database.ServerValue.TIMESTAMP,
            online: true,
          }
        },
        gameState: null,
      };
      await db.ref(`rooms/${roomCode}`).set(roomData);
      // Set onDisconnect to mark offline
      db.ref(`rooms/${roomCode}/players/${playerId}/online`).onDisconnect().set(false);
      onJoinRoom(roomCode, playerId, "red");
    } catch (e) {
      console.error(e);
      setError("Failed to create room: " + e.message);
    }
    setBusy(false);
  };

  const handleJoin = async () => {
    setError("");
    if (!name.trim()) { setError("Please enter your name"); return; }
    if (!/^\d{4}$/.test(code)) { setError("Enter a 4-digit room code"); return; }
    if (!firebaseReady) { setError("Firebase not configured. Please add config in the HTML file."); return; }
    setBusy(true);
    try {
      const snap = await db.ref(`rooms/${code}`).once("value");
      if (!snap.exists()) { setError("Room not found"); setBusy(false); return; }
      const room = snap.val();
      if (room.status === "playing") { setError("Game already in progress"); setBusy(false); return; }
      if (room.status === "finished") { setError("This game has already ended"); setBusy(false); return; }

      const usedColors = new Set(Object.values(room.players || {}).map(p => p.color));
      const availableColor = PLAYER_ORDER.find(c => !usedColors.has(c));
      if (!availableColor) { setError("Room is full (4 players max)"); setBusy(false); return; }

      const playerId = generatePlayerId();
      await db.ref(`rooms/${code}/players/${playerId}`).set({
        name: name.trim(),
        color: availableColor,
        joinedAt: firebase.database.ServerValue.TIMESTAMP,
        online: true,
      });
      db.ref(`rooms/${code}/players/${playerId}/online`).onDisconnect().set(false);
      onJoinRoom(code, playerId, availableColor);
    } catch (e) {
      console.error(e);
      setError("Failed to join: " + e.message);
    }
    setBusy(false);
  };

  if (!firebaseReady) {
    return (
      <div className="screen">
        <div className="lobby-card">
          <h1 className="lobby-title">தாயம்</h1>
          <p className="lobby-subtitle">Setup Required</p>
          <div className="error-msg" style={{textAlign:"left", lineHeight: 1.5}}>
            <strong>Firebase not configured.</strong><br/><br/>
            To enable online multiplayer:<br/>
            1. Create a free Firebase project at <strong>console.firebase.google.com</strong><br/>
            2. Enable Realtime Database (test mode)<br/>
            3. Open <strong>firebase-config.js</strong><br/>
            4. Paste your config values from Firebase<br/>
            5. Save and reload this page
          </div>
        </div>
      </div>
    );
  }

  if (mode === "home") {
    return (
      <div className="screen">
        <div className="lobby-card">
          <h1 className="lobby-title">தாயம் · Thaayam</h1>
          <p className="lobby-subtitle">Online Multiplayer</p>
          <input
            className="lobby-input"
            placeholder="Your name"
            value={name}
            onChange={(e) => saveName(e.target.value)}
            maxLength={20}
          />
          <button className="lobby-button btn-create" onClick={() => { if (name.trim()) setMode("create"); else setError("Enter your name first"); }}>
            🎲 Create Room
          </button>
          <div className="divider">OR</div>
          <button className="lobby-button btn-join" onClick={() => { if (name.trim()) setMode("join"); else setError("Enter your name first"); }}>
            🔗 Join Room
          </button>
          {error && <div className="error-msg">{error}</div>}
        </div>
      </div>
    );
  }

  if (mode === "create") {
    return (
      <div className="screen">
        <div className="lobby-card">
          <h1 className="lobby-title">Create Room</h1>
          <div className="info-msg">Welcome, <strong>{name}</strong>! Click below to create a room and get a 4-digit code to share.</div>
          <button className="lobby-button btn-create" onClick={handleCreate} disabled={busy}>
            {busy ? "Creating..." : "🎲 Create Now"}
          </button>
          {error && <div className="error-msg">{error}</div>}
          <button className="lobby-button btn-back" onClick={() => { setMode("home"); setError(""); }}>
            ← Back
          </button>
        </div>
      </div>
    );
  }

  if (mode === "join") {
    return (
      <div className="screen">
        <div className="lobby-card">
          <h1 className="lobby-title">Join Room</h1>
          <p className="lobby-subtitle">Enter 4-Digit Code</p>
          <input
            className="lobby-input code-input"
            placeholder="0000"
            value={code}
            onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 4))}
            maxLength={4}
            inputMode="numeric"
          />
          <button className="lobby-button btn-join" onClick={handleJoin} disabled={busy || code.length !== 4}>
            {busy ? "Joining..." : "🔗 Join"}
          </button>
          {error && <div className="error-msg">{error}</div>}
          <button className="lobby-button btn-back" onClick={() => { setMode("home"); setError(""); }}>
            ← Back
          </button>
        </div>
      </div>
    );
  }

  return null;
}

              }} />
              <div className="player-meta">
                <span className="player-name">{p.name}</span>
                <span className="player-color-name" style={{color: COLORS[p.color].dark}}>
                  {COLORS[p.color].label} · {COLORS[p.color].name}
                </span>
              </div>
              {pid === playerId && <span className="you-badge">YOU</span>}

            <div key={`waiting-${i}`} className="player-item" style={{opacity:0.5, borderLeftColor:"#ccc"}}>

  );
}

function MultiplayerGame({ roomCode, playerId, room, onLeave }) {
  const players = room.players || {};
  const me = players[playerId];
  const myColor = me?.color;
  const gs = room.gameState || {};

  // Local UI state (not synced)
  const [rolling, setRolling] = useState(false);
  const [animating, setAnimating] = useState(false);
  const [autoMoving, setAutoMoving] = useState(false);
  const [localDice, setLocalDice] = useState([null, null]);

  // Server state (single source of truth)
  const coins = gs.coins || makeInitialCoins();
  const currentPlayer = gs.currentPlayer || "red";
  const dice = gs.dice || [null, null];
  const diceValue = gs.diceValue;
  const hasRolled = gs.hasRolled || false;
  const pendingValues = gs.pendingValues || [];
  const message = gs.message || "";
  const winner = gs.winner;

  const isMyTurn = myColor === currentPlayer;
  const myPlayerKey = Object.keys(players).find(pid => players[pid].color === currentPlayer);
  const currentPlayerName = myPlayerKey ? players[myPlayerKey].name : "—";

  // ----- BOARD ROTATION based on player's color -----
  // We rotate the board so the player's yard sits at the BOTTOM.
  // Original layout: green=top, red=left, yellow=right, blue=bottom.
  // Rotating CW by N degrees moves content like: top→right, right→bottom, bottom→left, left→top.
  // To place each player's yard at BOTTOM:
  //   blue  (already bottom) → 0°
  //   yellow (right → bottom) → 90° CW
  //   green (top → bottom)    → 180°
  //   red   (left → bottom)   → 270° CW (= 90° CCW)
  const ROTATION_DEG = { blue: 0, yellow: 90, green: 180, red: 270 };
  const myRotation = ROTATION_DEG[myColor] ?? 0;

  // After rotating the board CW by myRotation, what color appears in each visual slot?
  // CW rotation moves content forward in the [top, right, bottom, left] cycle.
  // If original positions are top=green, right=yellow, bottom=blue, left=red,
  // and we rotate CW by k*90°, each piece of content moves k slots forward in the cycle.
  // So the slot that NOW shows position p was originally at (p - k) mod 4.
  function getYardSlots(rotation) {
    const cwOrder = ["green", "yellow", "blue", "red"]; // top, right, bottom, left (originals)
    const shift = rotation / 90; // 0,1,2,3
    // slot index 0 (top) now shows what was originally at index (0 - shift + 4) % 4
    return {
      top:    cwOrder[(0 - shift + 4) % 4],
      right:  cwOrder[(1 - shift + 4) % 4],
      bottom: cwOrder[(2 - shift + 4) % 4],
      left:   cwOrder[(3 - shift + 4) % 4],
    };
  }
  const yardSlots = getYardSlots(myRotation);

  // Get colors that have players (for turn rotation)
  const activeColors = useMemo(() => {
    const colorsInRoom = new Set(Object.values(players).map(p => p.color));
    return PLAYER_ORDER.filter(c => colorsInRoom.has(c));
  }, [players]);

  const getPlayerByColor = (color) => Object.values(players).find(p => p.color === color);

  // Helpers
  const hasCoinOnBoard = (color) =>
    Object.values(coins).some((c) => c.color === color && c.pathIndex >= 0 && !c.finished);

  const yardCoins = (color) =>
    Object.entries(coins).filter(([_, c]) => c.color === color && c.pathIndex === -1 && !c.finished);

  const finishedCount = (color) =>
    Object.values(coins).filter((c) => c.color === color && c.finished).length;

  const getMovableCoins = useMemo(() => {
    if (!hasRolled || pendingValues.length === 0 || !isMyTurn) return {};
    const movable = {};
    const onBoardFlag = hasCoinOnBoard(currentPlayer);
    Object.entries(coins).forEach(([id, coin]) => {
      if (coin.color !== currentPlayer || coin.finished) return;
      for (const v of pendingValues) {
        if (coin.pathIndex === -1) {
          if (!onBoardFlag && v === 1) { movable[id] = v; return; }
          if (onBoardFlag && ENTRY_VALUES.has(v)) { movable[id] = v; return; }
        } else {
          const newIdx = coin.pathIndex + v;
          if (newIdx < PATHS[currentPlayer].length) { movable[id] = v; return; }
        }
      }
    });
    return movable;
  }, [coins, currentPlayer, pendingValues, hasRolled, isMyTurn]);

  // Sync state to firebase (only the current player can modify game state)
  const updateGS = (updates) => db.ref(`rooms/${roomCode}/gameState`).update(updates);

  // Roll dice — only current player
  const rollDice = async () => {
    if (rolling || winner || autoMoving || animating || !isMyTurn || hasRolled) return;
    setRolling(true);
    let n = 0;
    const interval = setInterval(async () => {
      const d1 = Math.floor(Math.random() * 4);
      const d2 = Math.floor(Math.random() * 4);
      setLocalDice([d1, d2]);
      n++;
      if (n > 8) {
        clearInterval(interval);
        const f1 = Math.floor(Math.random() * 4);
        const f2 = Math.floor(Math.random() * 4);
        let value = f1 + f2;
        if (value === 0) value = 12;
        setLocalDice([f1, f2]);
        setRolling(false);
        // Push to server
        await updateGS({
          dice: [f1, f2],
          diceValue: value,
          hasRolled: true,
          pendingValues: [...(gs.pendingValues || []), value],
          lastMoveBy: playerId,
          moveCounter: (gs.moveCounter || 0) + 1,
        });
      }
    }, 80);
  };

  // Sync local dice with server
  useEffect(() => {
    if (!rolling) setLocalDice(dice);
  }, [dice, rolling]);

  // Re-evaluate roll on server-state change (only by current player)
  useEffect(() => {
    if (!isMyTurn || rolling || animating || autoMoving || winner) return;
    if (!hasRolled || pendingValues.length === 0) return;
    const value = pendingValues[pendingValues.length - 1];
    evaluateRoll(value, pendingValues);
  }, [hasRolled, JSON.stringify(pendingValues), JSON.stringify(coins), currentPlayer, isMyTurn]);

  const evaluateRoll = async (value, allValues) => {
    if (!isMyTurn) return;
    const onBoardFlag = hasCoinOnBoard(currentPlayer);

    const movableForThisValue = {};
    Object.entries(coins).forEach(([id, coin]) => {
      if (coin.color !== currentPlayer || coin.finished) return;
      if (coin.pathIndex === -1) {
        if (!onBoardFlag && value === 1) movableForThisValue[id] = value;
        if (onBoardFlag && ENTRY_VALUES.has(value)) movableForThisValue[id] = value;
      } else {
        const newIdx = coin.pathIndex + value;
        if (newIdx < PATHS[currentPlayer].length) movableForThisValue[id] = value;
      }
    });

    const movableAny = {};
    Object.entries(coins).forEach(([id, coin]) => {
      if (coin.color !== currentPlayer || coin.finished) return;
      for (const v of allValues) {
        if (coin.pathIndex === -1) {
          if (!onBoardFlag && v === 1) { movableAny[id] = v; return; }
          if (onBoardFlag && ENTRY_VALUES.has(v)) { movableAny[id] = v; return; }
        } else {
          const newIdx = coin.pathIndex + v;
          if (newIdx < PATHS[currentPlayer].length) { movableAny[id] = v; return; }
        }
      }
    });

    const movableIdsAny = Object.keys(movableAny);
    const movableIdsForValue = Object.keys(movableForThisValue);
    const isBonus = BONUS_VALUES.has(value);

    if (movableIdsAny.length === 0) {
      if (isBonus) {
        await updateGS({
          message: `${currentPlayerName} rolled ${value} (bonus). No moves — roll again!`,
          hasRolled: false,
          diceValue: null,
        });
      } else {
        await updateGS({
          message: `${currentPlayerName} rolled ${value} — no moves. Turn passes.`,
        });
        setTimeout(() => endTurn(), 400);
      }
      return;
    }

    const shouldAutoMove =
      (allValues.length === 1 && movableIdsForValue.length === 1) ||
      (movableIdsAny.length === 1);

    if (shouldAutoMove) {
      const coinId = movableIdsForValue.length === 1 ? movableIdsForValue[0] : movableIdsAny[0];
      const stepsToMove = movableForThisValue[coinId] || movableAny[coinId];
      let autoMsg = `${currentPlayerName} rolled ${value}. `;
      autoMsg += movableIdsAny.length === 1
        ? `Only one coin can move — auto-moving ${stepsToMove} step${stepsToMove > 1 ? "s" : ""}...`
        : `Auto-moving ${stepsToMove} step${stepsToMove > 1 ? "s" : ""}...`;
      await updateGS({ message: autoMsg });
      setAutoMoving(true);
      setTimeout(async () => {
        await executeMove(coinId);
        setAutoMoving(false);
      }, 350);
      return;
    }

    let msg = `${currentPlayerName} rolled ${value}.`;
    if (isBonus) msg += " 🎲 Bonus turn!";
    if (allValues.length > 1) msg += ` Pending: [${allValues.join(", ")}].`;
    if (movableIdsForValue.length === 0) {
      msg += ` Cannot use ${value} now. ${currentPlayerName} pick another coin.`;
    } else {
      msg += ` ${currentPlayerName}, click a glowing coin.`;
    }
    await updateGS({ message: msg });
  };

  const executeMove = async (coinId) => {
    if (!isMyTurn) return;
    const coin = coins[coinId];
    if (!coin || coin.color !== currentPlayer || coin.finished) return;

    const onBoardFlag = hasCoinOnBoard(currentPlayer);
    let usedValue = null;
    for (const v of pendingValues) {
      if (coin.pathIndex === -1) {
        if (!onBoardFlag && v === 1) { usedValue = v; break; }
        if (onBoardFlag && ENTRY_VALUES.has(v)) { usedValue = v; break; }
      } else {
        const newIdx = coin.pathIndex + v;
        if (newIdx < PATHS[currentPlayer].length) { usedValue = v; break; }
      }
    }
    if (usedValue === null) return;

    setAnimating(true);
    let startIdx = coin.pathIndex;
    let endIdx = coin.pathIndex === -1 ? 0 : coin.pathIndex + usedValue;

    // Step animation (sync each step to firebase)
    if (coin.pathIndex === -1) {
      const newCoins = { ...coins, [coinId]: { ...coin, pathIndex: 0 } };
      await updateGS({ coins: newCoins, message: `${currentPlayerName} entered the board!` });
      await new Promise((r) => setTimeout(r, 180));
      startIdx = 0;
    }

    for (let step = startIdx + 1; step <= endIdx; step++) {
      const snap = await db.ref(`rooms/${roomCode}/gameState/coins`).once("value");
      const cur = snap.val() || coins;
      const newCoins = { ...cur, [coinId]: { ...cur[coinId], pathIndex: step } };
      const stepsLeft = endIdx - step;
      await updateGS({
        coins: newCoins,
        message: stepsLeft > 0
          ? `Moving... ${stepsLeft} step${stepsLeft > 1 ? "s" : ""} to go`
          : `Moved ${usedValue} steps.`
      });
      await new Promise((r) => setTimeout(r, 120));
    }

    // Final landing — capture check
    const finalSquare = PATHS[currentPlayer][endIdx];
    const finished = endIdx === PATHS[currentPlayer].length - 1;

    const snap = await db.ref(`rooms/${roomCode}/gameState/coins`).once("value");
    const newCoins = { ...snap.val() };
    newCoins[coinId] = { ...newCoins[coinId], finished };
    let captured = false;
    let capturedNames = [];

    if (!SAFE_SQUARES.has(finalSquare) && !finished) {
      Object.entries(newCoins).forEach(([id, c]) => {
        if (c.color !== currentPlayer && !c.finished && c.pathIndex >= 0 && PATHS[c.color][c.pathIndex] === finalSquare) {
          newCoins[id] = { ...c, pathIndex: -1 };
          captured = true;
          const owner = getPlayerByColor(c.color);
          capturedNames.push(owner ? owner.name : COLORS[c.color].label);
        }
      });
    }

    const finishedNow = Object.values(newCoins).filter((c) => c.color === currentPlayer && c.finished).length;
    const isWinner = finishedNow === 6;

    const remaining = [...pendingValues];
    remaining.splice(remaining.indexOf(usedValue), 1);

    let msg = `${currentPlayerName} moved ${usedValue} step${usedValue > 1 ? "s" : ""}.`;
    if (captured) msg += ` 💥 Captured ${capturedNames.join(", ")}!`;
    if (finished) msg += " ⭐ Reached center!";
    if (SAFE_SQUARES.has(finalSquare) && !finished && coin.pathIndex !== -1) msg += " 🛡️ Safe on X.";

    if (isWinner) {
      await updateGS({
        coins: newCoins,
        winner: currentPlayer,
        message: `🎉 ${currentPlayerName} wins! All 6 coins reached the center!`,
      });
      await db.ref(`rooms/${roomCode}/status`).set("finished");
      setAnimating(false);
      return;
    }

    if (remaining.length > 0) {
      msg += ` Remaining: [${remaining.join(", ")}].`;
      await updateGS({
        coins: newCoins,
        pendingValues: remaining,
        message: msg,
      });
    } else {
      const lastRoll = diceValue;
      if (BONUS_VALUES.has(lastRoll) || captured || finished) {
        msg += " Roll again!";
        await updateGS({
          coins: newCoins,
          pendingValues: [],
          hasRolled: false,
          diceValue: null,
          message: msg,
        });
      } else {
        msg += " Turn ends.";
        await updateGS({
          coins: newCoins,
          pendingValues: [],
          message: msg,
        });
        setTimeout(() => endTurn(), 350);
      }
    }
    setAnimating(false);
  };

  const endTurn = async () => {
    const idx = activeColors.indexOf(currentPlayer);
    const next = activeColors[(idx + 1) % activeColors.length];
    const nextPlayer = getPlayerByColor(next);
    await updateGS({
      currentPlayer: next,
      diceValue: null,
      dice: [null, null],
      hasRolled: false,
      pendingValues: [],
      message: `${nextPlayer ? nextPlayer.name : COLORS[next].label}'s turn. Roll the dice.`,
    });
  };

  const handleCoinClick = (coinId) => {
    if (!isMyTurn || !hasRolled || rolling || winner || autoMoving || animating) return;
    if (!(coinId in getMovableCoins)) return;
    executeMove(coinId);
  };

  // ============================================================
  // RENDER
  // ============================================================

  const renderCell = (r, c) => {
    const key = `${r},${c}`;
    const isCenter = key === CENTER;
    const isEntry = key in ENTRY_COLOR_MAP;
    const entryColor = ENTRY_COLOR_MAP[key];
    const isCornerSafe = ["1,1", "1,5", "5,1", "5,5"].includes(key);
    const isSafe = SAFE_SQUARES.has(key);

    const coinsHere = Object.entries(coins).filter(([_, coin]) => {
      if (coin.pathIndex < 0 || coin.finished) return false;
      return PATHS[coin.color][coin.pathIndex] === key;
    });
    const finishedHere = isCenter ? Object.entries(coins).filter(([_, coin]) => coin.finished) : [];

    let bg = "#FAFAFA";
    if (isEntry) bg = COLORS[entryColor].main;
    else if (isCenter) bg = "#9E9E9E";
    else if (isSafe || isCornerSafe) bg = "#E8F5E9";

    const hasAnimatingCoin = animating && coinsHere.some(([_, c]) => c.color === currentPlayer);
    const cellStyle = {
      background: bg,
      boxShadow: hasAnimatingCoin
        ? `inset 0 0 0 3px ${COLORS[currentPlayer].main}, 0 0 12px ${COLORS[currentPlayer].main}`
        : "none",
      zIndex: hasAnimatingCoin ? 5 : 1,
    };

    return (
      <div key={key} className="cell" style={cellStyle}>
        <div className="cell-content-wrap">
          {(isSafe || isCornerSafe) && (
            <span className="x-mark" style={{
              color: isEntry || isCenter ? "rgba(0,0,0,0.85)" : "#1B5E20",
              textShadow: isEntry || isCenter ? "none" : "0 0 2px rgba(255,255,255,0.5)",
            }}>X</span>
          )}
          {coinsHere.length > 0 && (
            <div className="coin-stack">
              {coinsHere.slice(0, 4).map(([id, coin]) => {
                const isMovable = id in getMovableCoins;
                const sz = coinsHere.length > 1 ? "45%" : "75%";
                return (
                  <button
                    key={id}
                    onClick={() => handleCoinClick(id)}
                    className={`coin ${isMovable ? "pulse" : ""}`}
                    style={{
                      width: sz, height: sz,
                      background: `radial-gradient(circle at 30% 30%, ${COLORS[coin.color].light}, ${COLORS[coin.color].main} 60%, ${COLORS[coin.color].dark})`,
                      border: `1.5px solid ${COLORS[coin.color].dark}`,
                      boxShadow: isMovable
                        ? `0 0 0 2px white, 0 0 8px 3px ${COLORS[coin.color].main}`
                        : "0 1px 2px rgba(0,0,0,0.3)",
                      transform: isMovable ? "scale(1.1)" : "scale(1)",
                    }}
                  />
                );
              })}
              {coinsHere.length > 4 && (
                <span style={{position:"absolute", fontSize:"8px", fontWeight:700, color:"white"}}>+{coinsHere.length - 4}</span>
              )}
            </div>
          )}
          {isCenter && finishedHere.length > 0 && coinsHere.length === 0 && (
            <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center"}}>
              <span style={{color:"white", fontSize:"12px", fontWeight:700}}>⭐{finishedHere.length}</span>
            </div>
          )}
        </div>
      </div>
    );
  };

  const Pawn = ({ color, id, size = 20 }) => {
    const isMovable = id in getMovableCoins;
    return (
      <button
        onClick={() => id && handleCoinClick(id)}
        className={isMovable ? "pawn-pulse" : ""}
        style={{
          position: "relative", width: `${size}px`, height: `${size * 1.4}px`,
          transition: "all 0.2s",
          transform: isMovable ? "scale(1.15)" : "scale(1)",
          filter: isMovable
            ? `drop-shadow(0 0 4px ${COLORS[color].main}) drop-shadow(0 0 2px white)`
            : "drop-shadow(0 1px 1px rgba(0,0,0,0.3))",
        }}
      >
        <svg viewBox="0 0 20 28" width="100%" height="100%">
          <ellipse cx="10" cy="6" rx="5" ry="5" fill={COLORS[color].main} stroke={COLORS[color].dark} strokeWidth="0.5"/>
          <path d="M 6 11 Q 6 13 7 14 L 13 14 Q 14 13 14 11 Z" fill={COLORS[color].dark}/>
          <path d="M 7 14 L 6 22 L 14 22 L 13 14 Z" fill={COLORS[color].main} stroke={COLORS[color].dark} strokeWidth="0.4"/>
          <ellipse cx="10" cy="22" rx="6" ry="2" fill={COLORS[color].dark}/>
          <ellipse cx="10" cy="22" rx="6" ry="1.5" fill={COLORS[color].main}/>
          <ellipse cx="8.5" cy="4.5" rx="1.2" ry="1.5" fill="rgba(255,255,255,0.4)"/>
        </svg>
      </button>
    );
  };

  const renderYard = (color) => {
    const yc = yardCoins(color);
    const finished = finishedCount(color);
    const isCurrent = color === currentPlayer;
    const player = getPlayerByColor(color);
    const isMine = color === myColor;

    return (
      <div className={`yard ${isCurrent ? "current" : ""} ${isMine ? "assigned" : ""}`} style={{
        background: isCurrent ? COLORS[color].light : "transparent",
      }}>
        {isMine && <div className="you-sticker">YOU</div>}
        <div className="yard-label" style={{ color: COLORS[color].dark }}>
          {COLORS[color].label}
        </div>
        <div className="yard-grid">
          {yc.map(([id]) => <Pawn key={id} color={color} id={id} size={18} />)}
          {Array.from({ length: 6 - yc.length - finished }).map((_, i) => (
            <div key={`e-${i}`} style={{ width: "18px", height: "25px", opacity: 0.15 }}>
              <svg viewBox="0 0 20 28" width="100%" height="100%">
                <ellipse cx="10" cy="6" rx="5" ry="5" fill="none" stroke={COLORS[color].dark} strokeWidth="0.8" strokeDasharray="2"/>
                <path d="M 7 14 L 6 22 L 14 22 L 13 14 Z" fill="none" stroke={COLORS[color].dark} strokeWidth="0.6" strokeDasharray="2"/>
              </svg>
            </div>
          ))}
        </div>
        <div className="yard-finished" style={{ color: COLORS[color].dark }}>
          ⭐ {finished}/6
        </div>
        {player && (
          <div className="yard-name-tag" title={player.name}>
            {player.name}{isMine ? " (You)" : ""}
          </div>
        )}
      </div>
    );
  };

  const StickDie = ({ value }) => {
    if (value === null) return <div className="stick-die stick-die-empty"></div>;
    const dots = [];
    for (let i = 0; i < value; i++) dots.push(<div key={i} className="stick-dot"></div>);
    return (
      <div className="stick-die stick-die-rolled">
        {value === 0 ? <span style={{fontSize:"8px", color:"#44403C", fontWeight:700}}>FLAT</span> : dots}
      </div>
    );
  };

  const displayDice = rolling ? localDice : dice;

  return (
    <div className="app-root">
      <div className="title">
        <h1>தாயம் · Thaayam</h1>
        <p>Online · Room {roomCode}</p>
      </div>

      <div className="room-info-bar">
        Room: <strong>{roomCode}</strong>
      </div>

      <div className="my-identity-badge" style={{
        background: `linear-gradient(135deg, ${COLORS[myColor]?.main}, ${COLORS[myColor]?.dark})`,
      }}>
        <div className="my-identity-coin" style={{
          background: `radial-gradient(circle at 30% 30%, ${COLORS[myColor]?.light}, ${COLORS[myColor]?.main} 60%, ${COLORS[myColor]?.dark})`,
        }} />
        <span className="my-identity-text">
          You are {me?.name} · {COLORS[myColor]?.label}
        </span>
        <span className="my-identity-tamil">({COLORS[myColor]?.name})</span>
      </div>

      <div className="board-area">
        {renderYard(yardSlots.top)}
        <div className="middle-row">
          <div className="left-yard-slot">{renderYard(yardSlots.left)}</div>
          <div
            className="board"
            style={{
              transform: `rotate(${myRotation}deg)`,
              "--counter-rotate": `rotate(${-myRotation}deg)`,
            }}
          >
            <div className="board-grid">
              {Array.from({ length: 7 }, (_, r) =>
                Array.from({ length: 7 }, (_, c) => renderCell(r, c))
              )}
            </div>
          </div>
          <div className="right-yard-slot">{renderYard(yardSlots.right)}</div>
        </div>
        {renderYard(yardSlots.bottom)}
      </div>

      <div className="controls">
        {isMyTurn ? (
          <div className="your-turn-banner">⭐ YOUR TURN ⭐</div>
        ) : (
          <div className="turn-pill" style={{ background: COLORS[currentPlayer].main }}>
            {currentPlayerName}'s Turn ({COLORS[currentPlayer].label})
          </div>
        )}

        <div className="dice-row">
          <div style={{display:"flex", flexDirection:"column", gap:"6px"}}>
            <StickDie value={displayDice[0]} />
            <StickDie value={displayDice[1]} />
          </div>
          <div className="total-box">
            <div className="total-label">Total</div>
            <div className="total-value" style={{ border: `3px solid ${COLORS[currentPlayer].main}` }}>
              {diceValue ?? "—"}
            </div>
          </div>
          <button
            onClick={rollDice}
            disabled={!isMyTurn || rolling || hasRolled || winner || autoMoving || animating}
            className="roll-button"
            style={{
              background: isMyTurn
                ? `linear-gradient(135deg, ${COLORS[currentPlayer].main}, ${COLORS[currentPlayer].dark})`
                : "linear-gradient(135deg, #9E9E9E, #616161)",
            }}
          >
            {rolling ? "..." : animating ? "Moving" : autoMoving ? "Auto" : "Roll"}
          </button>
        </div>

        <div className="message-box">{message || "—"}</div>

        {pendingValues.length > 0 && (
          <div className="pending-box">
            Pending values: <strong>[{pendingValues.join(", ")}]</strong>
          </div>
        )}

        {winner && (
          <button
            onClick={onLeave}
            className="play-again bounce"
            style={{ background: COLORS[winner].main }}
          >
            🏠 Back to Lobby
          </button>
        )}

        <div className="legend">
          🎲 Bonus on 1, 5, 6, 12 · ✨ Glowing coins can move · 🛡️ X squares are SAFE
        </div>

        <button className="leave-room-btn" onClick={onLeave}>Leave Room</button>
      </div>
    </div>
  );
}

// ============================================================
// ROOT APP — manages screens
// ============================================================

function App() {
  const [screen, setScreen] = useState("lobby"); // lobby | waiting | game
  const [roomCode, setRoomCode] = useState(null);
  const [playerId, setPlayerId] = useState(null);
  const [myColor, setMyColor] = useState(null);
  const [room, setRoom] = useState(null);
  const [connected, setConnected] = useState(true);

  // Subscribe to firebase connection state
  useEffect(() => {
    if (!firebaseReady) return;
    const ref = db.ref(".info/connected");
    const cb = (snap) => setConnected(snap.val() === true);
    ref.on("value", cb);
    return () => ref.off("value", cb);
  }, []);

  // Subscribe to room
  useEffect(() => {
    if (!roomCode || !firebaseReady) return;
    const ref = db.ref(`rooms/${roomCode}`);
    const cb = (snap) => {
      const data = snap.val();
      if (!data) {
        // Room deleted
        handleLeave();
        return;
      }
      setRoom(data);
      if (data.status === "playing" && screen !== "game") {
        setScreen("game");
      } else if (data.status === "waiting" && screen !== "waiting") {
        setScreen("waiting");
      }
    };
    ref.on("value", cb);
    return () => ref.off("value", cb);
  }, [roomCode]);

  const handleJoinRoom = (code, pid, color) => {
    setRoomCode(code);
    setPlayerId(pid);
    setMyColor(color);
    setScreen("waiting");
  };

  const handleLeave = async () => {
    if (roomCode && playerId && firebaseReady) {
      try {
        const snap = await db.ref(`rooms/${roomCode}/players/${playerId}`).once("value");
        if (snap.exists()) {
          await db.ref(`rooms/${roomCode}/players/${playerId}`).remove();
        }
        // If room is empty or host left during waiting, delete it
        const roomSnap = await db.ref(`rooms/${roomCode}`).once("value");
        const roomData = roomSnap.val();
        if (!roomData?.players || Object.keys(roomData.players).length === 0) {
          await db.ref(`rooms/${roomCode}`).remove();
        } else if (roomData.host === playerId && roomData.status === "waiting") {
          // Host left during waiting -> delete room
          await db.ref(`rooms/${roomCode}`).remove();
        }
      } catch (e) {
        console.error("Leave error:", e);
      }
    }
    setRoomCode(null);
    setPlayerId(null);
    setMyColor(null);
    setRoom(null);
    setScreen("lobby");
  };

  return (
    <>
      {firebaseReady && (
        <div className={`conn-status ${connected ? "online" : "offline"}`}>
          <span className="conn-dot" />
          {connected ? "ONLINE" : "OFFLINE"}
        </div>
      )}

      {screen === "lobby" && <Lobby onJoinRoom={handleJoinRoom} />}
      {screen === "waiting" && room && (
        <WaitingRoom
          roomCode={roomCode}
          playerId={playerId}
          room={room}
          onLeave={handleLeave}
        />
      )}
      {screen === "game" && room && (
        <MultiplayerGame
          roomCode={roomCode}
          playerId={playerId}
          room={room}
          onLeave={handleLeave}
        />
      )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
